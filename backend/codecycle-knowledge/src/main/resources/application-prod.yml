server.port: ${KNOWLEDGE_PORT:8084}
spring.cloud.nacos.discovery.server-addr: ${NACOS_ADDR}
spring.cloud.nacos.discovery.namespace: ${NACOS_NAMESPACE:prod}
spring.datasource.url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username: ${POSTGRES_USER}
spring.datasource.password: ${POSTGRES_PASSWORD}
spring.data.redis.host: ${REDIS_HOST}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.password: ${REDIS_PASSWORD}
